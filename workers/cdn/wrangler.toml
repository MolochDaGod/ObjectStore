# ─── Grudge Asset CDN Worker ─────────────────────────────────────────
# LIVE at assets.grudge-studio.com (ObjectStore). Public CORS: `*`.
# Do NOT deploy F:\GitHub\GrudgeBuilder\workers\cdn — same Worker name,
# it would overwrite this route and drop range/cache-tag behaviour.
#
# Deploy:  npx wrangler deploy -c workers/cdn/wrangler.toml
# Test:    npx wrangler dev -c workers/cdn/wrangler.toml
# ─────────────────────────────────────────────────────────────────────

name = "grudge-asset-cdn"
main = "index.js"
compatibility_date = "2025-12-01"
workers_dev = true

# ── Custom domain ────────────────────────────────────────────────────
routes = [
  { pattern = "assets.grudge-studio.com/*", zone_name = "grudge-studio.com" }
]

# ── R2 Object Storage (shared with main ObjectStore worker) ─────────
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "grudge-assets"

# ── D1 Database (stats tracking — consolidated DB) ──────────────────
[[d1_databases]]
binding = "DB"
database_name = "grudge-objectstore"
database_id = "8fc367a8-9120-490e-a503-b0fcb755c044"

# Optional: npx wrangler secret put PURGE_TOKEN -c workers/cdn/wrangler.toml
# Until set, POST /_purge remains open (used for HTML-poison cleanup).
