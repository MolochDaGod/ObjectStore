<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grudge Spell VFX Library</title>
  <link rel="icon" id="page-favicon" type="image/svg+xml" />
  <script src="./js/asset-url.js"></script>
  <script>
    (function () {
      // Smaller than /branding/favicon.png (1.7 MB): /favicon.svg is a real
      // 163-byte SVG (200, image/svg+xml, magic '<svg'). assetUrl maps it to the CDN.
      var href = window.GrudgeAsset && GrudgeAsset.assetUrl('favicon.svg') || '';
      var link = document.getElementById('page-favicon');
      if (link && href) link.href = href;
    })();
  </script>
  <meta name="theme-color" content="#070b12" />
  <meta name="description" content="Grudge Warlords — 3D spell VFX showcase: projectiles, magic, and skill effects in a clean demo scene." />
  <style>
    :root {
      --bg: #070b12;
      --panel: #0f1520;
      --panel2: #121a28;
      --line: #243044;
      --text: #e8eef5;
      --muted: #8b95a8;
      --gold: #d4a84b;
      --accent: #aa44ff;
      --accent2: #ff44aa;
      --font: Inter, "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden;
    }
    a { color: #4a9eff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    button, input { font: inherit; }
    .app {
      display: grid;
      grid-template-columns: 320px 1fr;
      grid-template-rows: 54px 1fr;
      height: 100vh;
    }
    .top {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #141c2b, #0d131d);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand h1 {
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--gold), #f0d890);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .badge {
      font-size: 10px;
      color: var(--gold);
      border: 1px solid rgba(212, 168, 75, .35);
      background: rgba(212, 168, 75, .1);
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .top-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; }
    .btn, .top a.btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--text);
      padding: 6px 11px;
      border-radius: 7px;
      font-size: 11px;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover, .top a.btn:hover { border-color: var(--gold); color: var(--gold); text-decoration: none; }
    .btn.primary { background: var(--gold); border-color: var(--gold); color: #111; font-weight: 700; }
    .btn.primary:hover { filter: brightness(1.08); color: #111; }
    .btn.active { border-color: var(--gold); color: var(--gold); background: rgba(212, 168, 75, .12); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .side {
      border-right: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .side-tools { padding: 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
    .search {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #0b1018;
      color: var(--text);
      outline: 0;
      font-size: 12px;
    }
    .search:focus { border-color: var(--gold); }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip {
      border: 1px solid var(--line);
      background: 0;
      color: var(--muted);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 10px;
      cursor: pointer;
    }
    .chip.active { border-color: var(--gold); color: var(--gold); background: rgba(212, 168, 75, .1); }
    .list { flex: 1; overflow: auto; padding: 8px 8px 16px; }
    .group-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 10px 6px 6px;
      position: sticky;
      top: 0;
      background: var(--panel);
      z-index: 1;
    }
    .card {
      display: grid;
      grid-template-columns: 8px 1fr;
      gap: 0;
      border: 1px solid transparent;
      background: #0c121c;
      border-radius: 8px;
      margin-bottom: 5px;
      cursor: pointer;
      overflow: hidden;
    }
    .card:hover { border-color: var(--line); }
    .card.active { border-color: var(--gold); background: rgba(212, 168, 75, .1); }
    .card-swatch { background: var(--cat, #888); }
    .card-body { padding: 8px 10px 8px 9px; min-width: 0; }
    .card-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .card-name { font-size: 13px; font-weight: 600; }
    .card-cat { font-size: 9px; font-weight: 700; text-transform: uppercase; color: var(--cat, var(--muted)); }
    .card-desc { font-size: 11px; color: var(--muted); line-height: 1.4; margin-top: 3px; }
    .card-foot { display: flex; gap: 4px; margin-top: 7px; }
    .card-foot button {
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--muted);
      padding: 3px 7px;
      border-radius: 5px;
      font-size: 10px;
      cursor: pointer;
    }
    .card-foot button:hover { border-color: var(--gold); color: var(--text); }
    .stage-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
      background: #05070c;
    }
    #stage { position: absolute; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    .hud {
      position: absolute;
      left: 16px;
      right: 16px;
      top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
    }
    .hud-title { text-shadow: 0 2px 12px #000; }
    .hud-title h2 { font-size: 18px; font-weight: 700; }
    .hud-title p { font-size: 12px; color: var(--muted); margin-top: 3px; max-width: 520px; }
    .hud-meta { font-size: 10px; color: var(--muted); text-align: right; font-family: var(--mono); line-height: 1.5; }
    .hint {
      position: absolute;
      bottom: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: end;
      font-size: 11px;
      color: var(--muted);
      pointer-events: none;
      text-shadow: 0 1px 8px #000;
    }
    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel2);
      border: 1px solid var(--gold);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 40;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
      max-width: min(720px, 90vw);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
    .empty { color: var(--muted); text-align: center; padding: 28px 10px; font-size: 12px; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }
    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; grid-template-rows: 54px 42vh 1fr; height: auto; min-height: 100vh; overflow: auto; }
      .side { border-right: 0; border-top: 1px solid var(--line); max-height: none; grid-row: 3; }
      .stage-wrap { grid-row: 2; height: 42vh; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/0.185.0/build/three.module.js",
      "three/addons/": "./vendor/three/0.185.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <h1>Grudge Spell VFX Library</h1>
        <span class="badge">3D showcase · three r185</span>
      </div>
      <div class="top-actions">
        <button type="button" class="btn primary" id="demoBtn" aria-pressed="false">Demo</button>
        <button type="button" class="btn" id="replayBtn">Replay</button>
        <a class="btn" href="./api/v1/vfx-spells.json" target="_blank" rel="noopener">JSON API</a>
        <a class="btn" href="3dfx-viewer.html">3DFX Viewer</a>
      </div>
    </header>
    <aside class="side">
      <div class="side-tools">
        <input class="search" id="search" type="search" placeholder="Search spells…" autocomplete="off" />
        <div class="chips" id="chips"></div>
        <div id="stats" style="font-size:11px;color:var(--muted)"></div>
      </div>
      <div class="list" id="list" role="listbox" aria-label="Spell list"></div>
    </aside>
    <div class="stage-wrap" id="stageWrap">
      <div id="stage" role="img" aria-label="Spell VFX viewport"></div>
      <div class="hud">
        <div class="hud-title">
          <h2 id="hudName">Select a spell</h2>
          <p id="hudDesc">Click a spell to cast it, or run Demo to cycle the library.</p>
        </div>
        <div class="hud-meta" id="hudMeta"></div>
      </div>
      <div class="hint">
        <span>Drag to orbit · scroll to zoom · Esc stops Demo</span>
        <span id="hintRight">Caster ← left · Target → right</span>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <p class="sr-only" id="live" aria-live="polite"></p>
  <script type="module" src="./js/spell-vfx-showcase.js"></script>
  <script src="./js/nav.js" defer></script>
</body>
</html>
